<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <link rel="icon" href="assets/images/rubyan.png" type="image/x-icon" />
    <title>:: Next-Gen RunsNet ::</title>
    <link rel="stylesheet" href="assets/plugins/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="view/assets/css/theme2.css" />
    <style>
        .auth .card {
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .switch-button {
            background: none;
            border: none;
            color: #007bff;
            text-decoration: underline;
            cursor: pointer;
        }

        .switch-button:hover {
            color: #0056b3;
        }

        .form-container {
            display: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0;
            transform: translateY(10px);
        }

        .form-container.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        body::after {
            background: url("assets/images/bg.jpg") top center;
            background-size: cover;
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -1;
        }

        .btn-group-toggle .btn-custom {
            border: 3px solid #ef6f6f;
            color: #ef6f6f;
            font-weight: 600;
            border-radius: 30px;
            transition: all 0.3s ease-in-out;
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .btn-group-toggle .btn-custom:hover {
            background-color: rgba(0, 123, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.15);
        }

        .btn-group-toggle .btn-custom.active {
            background-color: #ef6f6f;
            color: #fff !important;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
        }

        .btn-group-toggle .btn-custom.hr-active {
            background-color: #28a745 !important;
            border-color: #ef6f6f !important;
            color: #fff !important;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
        }
        .password-wrapper {
            position: relative;
            width: 100%;
        }
        .password-wrapper .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
        }
    </style>
</head>

<body class="font-opensans">
    <div class="auth">
        <div class="auth_left">
            <div class="card">
                <div class="card-body pb-5">
                    <div class="text-center mb-3">
                        <a class="header-brand" href="#">
                            <img src="assets/images/rubyan.png" style="width: 70%;">
                        </a>
                    </div>

                    <!-- === Switch Panel Buttons === -->
                    <div class="col-12">
                        <div class="card-title" align="center"><b>Login to your account</b></div>
                        <div class="row">
                            <div class="col-12 text-center mb-3">
                                <div class="btn-group btn-group-toggle d-flex w-100" data-toggle="buttons">
                                    <label class="btn btn-custom flex-fill active" id="labelAdmin">
                                        <input type="radio" name="panelOption" id="adminOption" autocomplete="off" checked onchange="switchPanel('admin')">
                                        <i class="fa fa-user-shield me-2"></i> Panel Apps
                                    </label>
                                    <label class="btn btn-custom flex-fill" id="labelHR">
                                        <input type="radio" name="panelOption" id="hrOption" autocomplete="off" onchange="switchPanel('hr')">
                                        <i class="fa fa-users me-2"></i> HR Apps
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- === Login Form === -->
                    <form id="loginForm" method="post" action="view/control/bagan_login.php" class="form-container active">
                        <div class="form-group mb-2">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" name="username" placeholder="Enter username" required>
                        </div>
                        <div class="form-group mb-2">
                            <label class="form-label">Password</label>
                            <div class="password-wrapper">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                                <span class="toggle-password" id="togglePassword">
                                    <i class="fa fa-eye"></i>
                                </span>
                            </div>
                        </div>
                        <div class="form-footer">
                            <button type="submit" name="simpan" class="btn btn-danger btn-block"><b>MASUK</b></button>
                        </div>
                        <div class="text-center pt-3">
                            <button type="button" class="switch-button" onclick="switchForm('forgotForm')">Forgot Password?</button>
                        </div>
                    </form>

                    <!-- === Forgot Password Form === -->
                    <div id="forgotForm" class="form-container">
                        <div class="card-title text-center"><b>Forgot Password</b></div>
                        <div class="form-group">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" name="username_or_email" id="usernameOrEmail" placeholder="Enter your username" required>
                        </div>
                        <div class="form-footer">
                            <a href="#" class="btn btn-warning btn-block" onclick="forgotpassword()"><b>SUBMIT</b></a>
                        </div>
                        <div class="text-center pt-3">
                            <button type="button" class="switch-button" onclick="switchForm('loginForm')">Back to Login</button>
                        </div>
                    </div>
                </div>

                <div class="card-footer text-center">
                    <b class="form-label" style="color:red" id="errormessage"></b>
                </div>
            </div>
        </div>

        <div class="auth_right">
            <div class="carousel slide" data-ride="carousel" data-interval="3000">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="view/assets/images/slider1.svg" class="img-fluid" alt="login page" />
                    </div>
                    <div class="carousel-item">
                        <img src="view/assets/images/slider2.svg" class="img-fluid" alt="login page" />
                    </div>
                    <div class="carousel-item">
                        <img src="view/assets/images/slider3.svg" class="img-fluid" alt="login page" />
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/bundles/lib.vendor.bundle.js"></script>
    <script src="assets/js/core.js"></script>
    <script>
        const password = document.getElementById("password");
        const toggle = document.getElementById("togglePassword");

        toggle.addEventListener("click", () => {
            const type = password.type === "password" ? "text" : "password";
            password.type = type;

            toggle.innerHTML = type === "password"
                ? '<i class="fa fa-eye"></i>'
                : '<i class="fa fa-eye-slash"></i>';
        });
        
        // Ganti form aktif (login <-> forgot)
        function switchForm(formId) {
            document.querySelectorAll('.form-container').forEach(form => {
                form.classList.remove('active');
            });
            document.getElementById(formId).classList.add('active');
        }

        // Ganti panel admin/hr
        function switchPanel(panel) {
            const form = document.getElementById('loginForm');
            const labelAdmin = document.getElementById('labelAdmin');
            const labelHR = document.getElementById('labelHR');

            labelAdmin.classList.remove('active', 'hr-active');
            labelHR.classList.remove('active', 'hr-active');

            if (panel === 'admin') {
                form.action = 'view/control/bagan_login.php';
                labelAdmin.classList.add('active');
            } else if (panel === 'hr') {
                form.action = 'view/control/bagan_login_apk.php';
                labelHR.classList.add('active', 'hr-active');
            }
        }

        // Forgot password ajax
        function forgotpassword() {
            var username = document.getElementById("usernameOrEmail").value;
            if (getCookie("ChangeAttemp") <= 5) {
                setCookie("ChangeAttemp", parseInt(getCookie("ChangeAttemp") || 0) + 1, 15);
                jQuery.ajax({
                    type: "POST",
                    url: "view/control/bagan_forgetpass.php?data1=" + username,
                    dataType: 'json',
                    success: function (obj) {
                        document.getElementById('errormessage').innerHTML = obj.data['data_a'];
                    }
                });
            } else {
                document.getElementById('errormessage').innerHTML = "Terlalu banyak permintaan. Coba lagi dalam 15 menit.";
            }
        }

        function setCookie(name, value, minutesToExpire) {
            const date = new Date();
            date.setTime(date.getTime() + (minutesToExpire * 60 * 1000));
            document.cookie = `${name}=${value}; expires=${date.toUTCString()}; path=/`;
        }

        function getCookie(name) {
            const cookies = document.cookie.split("; ");
            for (let i = 0; i < cookies.length; i++) {
                const [key, value] = cookies[i].split("=");
                if (key === name) return value;
            }
            return null;
        }
    </script>
</body>
</html>
