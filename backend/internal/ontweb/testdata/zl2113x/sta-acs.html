<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<html>
<head>
<title>Remote Management Status</title>
 <meta http-equiv="Content-Type" content="text/html; charset=gb2312"/>
 <link rel="stylesheet" type=text/css href="/JS/reset.css" />
 <link rel="stylesheet" type=text/css href="/JS/base.css" />
  <link rel="stylesheet" type=text/css href="/JS/stylemain.css" />
<LINK href="/JS/style_zimm.css" type=text/css rel=stylesheet />
<SCRIPT language=javascript src="/JS/menu.js"></SCRIPT>
<SCRIPT language=javascript src="/JS/jquery.js"></SCRIPT>
<SCRIPT language=javascript src="/JS/util.js"></SCRIPT>
</head>
<body vLink=#000000 aLink=#000000 link=#000000
    leftMargin=0 topMargin=0 onload="DisplayLocation(getElement('Selected_Menu').value);FinishLoad();if(getElById('ConfigForm') != null)LoadFrame()"
    onunload=DoUnload() marginheight="0" marginwidth="0">
<div id="wrapper">
    <div id="header">
	  <div class="top_bg round">
		<table>
		  <tr><td style="font-size:20px;padding-top:20px;color:black;align:right;">&nbsp;&nbsp;</td></tr>
		  <tr><td style="padding-top:10px;align:right;">
			<A onclick=DoLogout() href="/cgi-bin/logout.cgi" id=logOut name=logOut target=_top>
			<SPAN class=logout>Logout </SPAN></A>
			</td></tr>
		<table>
		<table>
			<tr><td style="padding-top:20px;color:white;align:right;"></td></tr>
		</table>
	  </div>
	  <div class="nav_side clearfix">
		  <TABLE id=table2 height=40 cellSpacing=0 cellPadding=0 width=960 border=0>
				<TBODY>
				<TR class="round">
				  <TD id=MenuArea_L1 vAlign=bottom bgColor=#000000  colSpan=3 height=30>&nbsp;</TD>
				  <TD bgColor=#000000  width=80 >
				  <INPUT id=Selected_Menu type=hidden 
					value="Status->CWMP Status" name=Sta_Dev>
				  </TD></TR>
				</TBODY></TABLE>
	   </div>
    </div>
    <div id="main" class="clearfix">
		<div id="side_wrapper">
		   <div class="box_wrapper round">
			<div class="box_content" id="MenuArea_L2">
			<SCRIPT language=javascript>
				MakeMenu_ZIMM(getElById ('Selected_Menu').value);
			</SCRIPT>
			</div>
		   </div>
		</div>   
		<div id="content">
			<div class="column">
				<div class="column_title">
					<div class="column_title_left"></div>
						<p>CWMP Status</p>
					<div class="column_title_right"></div>
				</div>
				<div class="data_common">
					<SCRIPT language=JavaScript type=text/javascript>
					var resultinfo = "N/A";
					var autoreportinfo = "N/A";
					var itmsconn = "N/A";
					</SCRIPT>	
					<TABLE cellSpacing=0 cellPadding=3 width=434 border=0>
                    <TBODY>
					<TR>
                      <TD class=table_title width=171>Inform Status :</TD>
                      <TD width=245>
                        <SCRIPT language=javascript>
						var result = "1";
						switch(result)
						{
							case "0":
								document.writeln("Unreported (E-home terminal is starting) ");
								break;
							case "1":
								document.writeln("Unreported (No remote management WAN connection) ");
								break;
							case "2":
								document.writeln("Unreported (Remote management WAN connection is not valid) ");
								break;
							case "3":
								document.writeln("Unreported (No management channel DNS information) ");
								break;
							case "4":
								document.writeln("Unreported (No ACS configuration parameters) ");
								break;
							case "5":
								document.writeln("Unreported (ACS domain parsed failed)");
								break;
							case "6":
								document.writeln("Reported no response");
								break;
							case "7":
								document.writeln("Reporting process interrupt"); 
								break;
							case "8":
								document.writeln("Reported successfully");
								break;
							 default:
								document.writeln("N/A");
								break;			
						}						
						</SCRIPT>
                      </TD></TR>
					<TR>
                      <TD class=table_title width=172>Accepting ITMS connection request Status:</TD>
                      <TD width=244>
                        <SCRIPT language=javascript>
						var result = "0";
						switch(result)
						{
							case "0":
								document.writeln("No received remote connection request");
								break;
							case "1":
								document.writeln("The remote connection process initiated by ITMS is interrupted");
								break;
							case "2":
								document.writeln("The remote connection process initiated by ITMS is successful");
								break;
							 default:
								document.writeln("No received remote connection request");
								break;			
						}						
						</SCRIPT>
                    </TD></TR>					  
					  </TBODY></TABLE>					
				</div>
			</div>
		</div>
    </div>
</div>
</body>
</html>
