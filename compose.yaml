services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter_password
      POSTGRES_DB: starter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U starter -d starter']
      interval: 2s
      timeout: 5s
      retries: 20

  migrator:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://starter:starter_password@postgres:5432/starter
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://starter:starter_password@postgres:5432/starter
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-noc-system-secure-auth-secret-32-chars}
      BETTER_AUTH_URL: http://localhost:3000
      DEVICE_SECRET: ${DEVICE_SECRET:-noc-device-secret-key-32chars-ok}
      DASHBOARD_DATA: ${DASHBOARD_DATA:-live}
      DATA_MODE: ${DATA_MODE:-nyata}
      ALLOW_EMPTY_DEVICES: "true"
      # Rahasia tiket realtime: sama dengan backend (disimpan di .env, bukan di git).
      REALTIME_TOKEN_SECRET: ${REALTIME_TOKEN_SECRET:?isi REALTIME_TOKEN_SECRET di file .env}
      # Alamat backend yang dibuka BROWSER (bukan alamat antar-kontainer).
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    ports:
      # Hanya loopback: browser di komputer ini. Ubah sadar bila perlu diakses dari jaringan.
      - "127.0.0.1:8080:8080"
    environment:
      BACKEND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgresql://starter:starter_password@postgres:5432/starter
      REALTIME_TOKEN_SECRET: ${REALTIME_TOKEN_SECRET:?isi REALTIME_TOKEN_SECRET di file .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Kunci yang sama dengan aplikasi: membuka kata sandi router terenkripsi di database.
      DEVICE_SECRET: ${DEVICE_SECRET:-noc-device-secret-key-32chars-ok}
      DASHBOARD_DATA: ${DASHBOARD_DATA:-live}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  db-ui:
    image: sosedoff/pgweb:latest
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://starter:starter_password@postgres:5432/starter?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  studio:
    build:
      context: .
      target: studio
    ports:
      - "4983:4983"
    environment:
      DATABASE_URL: postgresql://starter:starter_password@postgres:5432/starter
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  postgres-data:
