services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter_password
      POSTGRES_DB: starter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 2s
      timeout: 5s
      retries: 20

  migrator:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://starter:starter_password@postgres:5432/starter
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    ports:
      - "${APP_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://starter:starter_password@postgres:5432/starter
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-noc-system-secure-auth-secret-32-chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      DEVICE_SECRET: ${DEVICE_SECRET:-noc-device-secret-key-32chars-ok}
      DASHBOARD_DATA: ${DASHBOARD_DATA:-live}
      DATA_MODE: ${DATA_MODE:-nyata}
      ALLOW_EMPTY_DEVICES: "true"
      # Rahasia tiket realtime: sama dengan backend (disimpan di .env, bukan di git).
      REALTIME_TOKEN_SECRET: ${REALTIME_TOKEN_SECRET:?isi REALTIME_TOKEN_SECRET di file .env}
      DEPLOY_PAGE_ROLE: ${DEPLOY_PAGE_ROLE:-local}
      # genieacs:7557 = GenieACS lokal (compose.genieacs.yaml) atau tunnel ke server (compose.genieacs-tunnel.yaml).
      GENIEACS_NBI_URL: ${GENIEACS_NBI_URL:-http://genieacs:7557}
      # Alamat backend yang dibuka BROWSER (bukan alamat antar-kontainer).
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
      # Alamat backend dipanggil dari SERVER Next.js sendiri (sinkron billing,
      # ikat TR-069, dll): nama layanan Compose, BUKAN localhost (app dan
      # backend adalah kontainer berbeda; localhost di dalam app = app sendiri).
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
      # OSRM untuk POST /api/snap (compose.osrm.yaml, jaringan yang sama).
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://osrm:5000}
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:-http://localhost:3301}
      LOGTO_INTERNAL_ENDPOINT: ${LOGTO_INTERNAL_ENDPOINT:-http://nocsystem-logto:3001}
      LOGTO_CLIENT_ID: ${LOGTO_CLIENT_ID:-}
      LOGTO_CLIENT_SECRET: ${LOGTO_CLIENT_SECRET:-}
      PORT: 3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    ports:
      # Hanya loopback: browser di komputer ini. Ubah sadar bila perlu diakses dari jaringan.
      - "127.0.0.1:8080:8080"
      # Syslog router (UDP) untuk diagnosa pelanggan. Tanpa autentikasi: listener
      # hanya menerima alamat router terdaftar atau yang dipetakan di SYSLOG_SOURCE_MAP.
      - "5514:5514/udp"
      # NetFlow v5 router (traffic-flow) untuk diagnosa trafik per pelanggan; hanya
      # router terdaftar atau yang dipetakan NETFLOW_SOURCE_MAP yang diterima.
      - "2055:2055/udp"
    environment:
      BACKEND_ADDR: 0.0.0.0:8080
      SYSLOG_ADDR: ${SYSLOG_ADDR:-0.0.0.0:5514}
      # Router yang mengirim log dari alamat lain (mis. WireGuard 10.20.30.1):
      # "10.20.30.1=<uuid router>". Alamat tak dikenal dicatat di log backend.
      SYSLOG_SOURCE_MAP: ${SYSLOG_SOURCE_MAP:-}
      SYSLOG_RETENTION_DAYS: ${SYSLOG_RETENTION_DAYS:-14}
      NETFLOW_ENABLED: ${NETFLOW_ENABLED:-true}
      NETFLOW_ADDR: ${NETFLOW_ADDR:-:2055}
      # Sama seperti SYSLOG_SOURCE_MAP (Docker Desktop mengganti alamat sumber UDP).
      NETFLOW_SOURCE_MAP: ${NETFLOW_SOURCE_MAP:-}
      NETFLOW_RETENTION_DAYS: ${NETFLOW_RETENTION_DAYS:-7}
      DATABASE_URL: postgresql://starter:starter_password@postgres:5432/starter
      REALTIME_TOKEN_SECRET: ${REALTIME_TOKEN_SECRET:?isi REALTIME_TOKEN_SECRET di file .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:3000}
      # Kunci yang sama dengan aplikasi: membuka kata sandi router terenkripsi di database.
      DEVICE_SECRET: ${DEVICE_SECRET:-noc-device-secret-key-32chars-ok}
      DASHBOARD_DATA: ${DASHBOARD_DATA:-live}
      # Ikat profil TR-069 ke ONU baru di OLT secara otomatis (backend MENULIS ke OLT).
      # new (bawaan) = hanya ONU yang muncul sesudah dinyalakan; all = semua ONU online;
      # off = mati. Profil TR-069 (OLT_TR069_PROFILE_ID) harus SUDAH dibuat di OLT lewat
      # CLI (onu-tr069-profile add ...) sebelum ini berguna; tanpa itu backend hanya
      # mencatat peringatan, tidak menulis apa pun.
      OLT_TR069_AUTOBIND: ${OLT_TR069_AUTOBIND:-new}
      OLT_TR069_PROFILE_ID: ${OLT_TR069_PROFILE_ID:-1}
      OLT_TR069_MAX_PER_ROUND: ${OLT_TR069_MAX_PER_ROUND:-5}
      # "Pasang GenieACS lewat web ONT": alamat ACS dan kredensial admin modem diisi di aplikasi
      # (tabel ont_web_settings, terenkripsi). Env hanya membatasi jaringan modem yang boleh
      # dibuka (bawaan: alamat pribadi RFC 1918 + 100.64.0.0/10).
      ONT_WEB_ALLOWED_CIDRS: ${ONT_WEB_ALLOWED_CIDRS:-}
      # Fitur CPE backend membaca GenieACS yang sama dengan aplikasi.
      GENIEACS_NBI_URL: ${GENIEACS_NBI_URL:-http://genieacs:7557}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  db-ui:
    image: sosedoff/pgweb:latest
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://starter:starter_password@postgres:5432/starter?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  studio:
    build:
      context: .
      target: studio
    ports:
      - "4983:4983"
    environment:
      DATABASE_URL: postgresql://starter:starter_password@postgres:5432/starter
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  postgres-data:
